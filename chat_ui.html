<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DocChat</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0d0d;
      --surface: #161616;
      --border: #2a2a2a;
      --accent: #e8ff47;
      --text: #e8e8e8;
      --muted: #666;
    }

    body {
      font-family: 'IBM Plex Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* LOGIN SCREEN */
    #login-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      gap: 16px;
      padding: 32px;
    }

    .logo { font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: var(--accent); letter-spacing: 4px; margin-bottom: 8px; }
    .login-title { font-size: 26px; font-weight: 300; }
    .login-sub { font-size: 12px; color: var(--muted); font-family: 'IBM Plex Mono', monospace; margin-bottom: 8px; }

    .field { display: flex; flex-direction: column; gap: 6px; width: 100%; max-width: 400px; }
    .field label { font-size: 11px; font-family: 'IBM Plex Mono', monospace; color: var(--muted); letter-spacing: 1px; }

    .field input {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 14px;
      padding: 12px 14px;
      border-radius: 4px;
      outline: none;
      transition: border-color 0.2s;
      width: 100%;
    }

    .field input:focus { border-color: var(--accent); }

    .btn-primary {
      background: var(--accent);
      color: #000;
      border: none;
      padding: 13px 32px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 2px;
      cursor: pointer;
      border-radius: 2px;
      width: 100%;
      max-width: 400px;
      transition: opacity 0.2s;
      margin-top: 4px;
    }

    .btn-primary:hover { opacity: 0.85; }
    .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }

    /* CHAT SCREEN */
    #chat-screen { display: none; flex-direction: column; height: 100vh; }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }

    .header-left { display: flex; align-items: center; gap: 16px; }
    .header-logo { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--accent); letter-spacing: 3px; }
    .doc-label { font-size: 11px; color: var(--muted); font-family: 'IBM Plex Mono', monospace; }

    select#doc-select {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      padding: 6px 10px;
      border-radius: 2px;
      outline: none;
      cursor: pointer;
      max-width: 240px;
    }

    select#doc-select:focus { border-color: var(--accent); }

    .btn-logout {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      padding: 6px 12px;
      cursor: pointer;
      border-radius: 2px;
      transition: all 0.2s;
    }

    .btn-logout:hover { border-color: #ff4747; color: #ff4747; }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 32px 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      scroll-behavior: smooth;
    }

    #messages::-webkit-scrollbar { width: 4px; }
    #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .msg-wrap { display: flex; flex-direction: column; max-width: 680px; animation: fadeUp 0.3s ease; }
    .msg-wrap.user { align-self: flex-end; align-items: flex-end; }
    .msg-wrap.bot  { align-self: flex-start; align-items: flex-start; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .msg-label { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--muted); letter-spacing: 2px; margin-bottom: 6px; text-transform: uppercase; }
    .msg-wrap.user .msg-label { color: var(--accent); }

    .bubble { padding: 14px 18px; border-radius: 4px; font-size: 14px; line-height: 1.7; word-break: break-word; }
    .msg-wrap.user .bubble { background: #1e1e1e; border: 1px solid var(--border); }
    .msg-wrap.bot  .bubble { background: #111; border: 1px solid #222; }

    .typing-indicator { display: flex; gap: 5px; padding: 14px 18px; background: #111; border: 1px solid #222; border-radius: 4px; width: fit-content; }
    .dot { width: 6px; height: 6px; background: var(--muted); border-radius: 50%; animation: bounce 1.2s infinite; }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce { 0%,80%,100%{transform:translateY(0);opacity:.4} 40%{transform:translateY(-6px);opacity:1} }

    .empty-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: var(--muted); }
    .empty-icon { font-size: 32px; opacity: 0.3; margin-bottom: 8px; }
    .empty-sub { font-size: 12px; font-family: 'IBM Plex Mono', monospace; }

    footer {
      padding: 16px 24px;
      border-top: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    textarea#chat-input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 14px;
      padding: 12px 16px;
      border-radius: 4px;
      resize: none;
      outline: none;
      min-height: 48px;
      max-height: 120px;
      line-height: 1.5;
      transition: border-color 0.2s;
    }

    textarea#chat-input:focus { border-color: var(--accent); }
    textarea#chat-input::placeholder { color: var(--muted); }

    .send-btn {
      background: var(--accent);
      border: none;
      color: #000;
      width: 48px;
      height: 48px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.2s;
      flex-shrink: 0;
    }

    .send-btn:hover { opacity: 0.85; }
    .send-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    .error-toast {
      position: fixed;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%);
      background: #ff4747;
      color: #fff;
      padding: 10px 20px;
      border-radius: 4px;
      font-size: 12px;
      font-family: 'IBM Plex Mono', monospace;
      display: none;
      z-index: 100;
    }
  </style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="login-screen">
  <div class="logo">DOCCHAT</div>
  <div class="login-title">Sign in to continue</div>
  <div class="login-sub">// use your account credentials</div>

  <div class="field">
    <label>EMAIL</label>
    <input type="email" id="email" placeholder="you@example.com" />
  </div>

  <div class="field">
    <label>PASSWORD</label>
    <input type="password" id="password" placeholder="••••••••"
      onkeydown="if(event.key==='Enter') login()" />
  </div>

  <button class="btn-primary" onclick="login()" id="login-btn">LOGIN →</button>
</div>

<!-- CHAT SCREEN -->
<div id="chat-screen">
  <header>
    <div class="header-left">
      <div class="header-logo">DOCCHAT</div>
      <span class="doc-label">DOC:</span>
      <select id="doc-select">
        <option value="">— select document —</option>
      </select>
    </div>
    <button class="btn-logout" onclick="logout()">LOGOUT</button>
  </header>

  <div id="messages">
    <div class="empty-state" id="empty-state">
      <div class="empty-icon">◈</div>
      <div class="empty-title">Select a document to begin</div>
      <div class="empty-sub">// ask anything about your doc</div>
    </div>
  </div>

  <footer>
    <textarea id="chat-input" placeholder="Ask something about your document..." rows="1"
      onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
    <button class="send-btn" id="send-btn" onclick="sendMessage()">➤</button>
  </footer>
</div>

<div class="error-toast" id="error-toast"></div>

<script>
  const API = 'http://127.0.0.1:8000';
  let isLoading = false;

  function showError(msg) {
    const t = document.getElementById('error-toast');
    t.textContent = msg;
    t.style.display = 'block';
    setTimeout(() => t.style.display = 'none', 3000);
  }

  async function login() {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value.trim();
    if (!email || !password) return showError('Fill in all fields');

    const btn = document.getElementById('login-btn');
    btn.disabled = true;
    btn.textContent = 'CONNECTING...';

    try {
      const form = new URLSearchParams();
      form.append('username', email);
      form.append('password', password);

      const res = await fetch(`${API}/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: form,
        credentials: 'include'  // stores cookies from response
      });

      if (!res.ok) { showError('Invalid credentials'); return; }

      await loadDocuments();
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('chat-screen').style.display = 'flex';

    } catch (e) {
      showError('Cannot connect to server');
    } finally {
      btn.disabled = false;
      btn.textContent = 'LOGIN →';
    }
  }

  async function loadDocuments() {
    const res = await fetch(`${API}/showDocuments`, {
      method: 'POST',
      credentials: 'include'  // sends cookies automatically
    });

    if (!res.ok) { showError('Failed to load documents'); return; }

    const docs = await res.json();
    const select = document.getElementById('doc-select');
    select.innerHTML = '<option value="">— select document —</option>';
    docs.forEach(doc => {
      const opt = document.createElement('option');
      opt.value = doc.file_id;
      opt.textContent = `[${doc.file_id}] ${doc.file_path.split(/[\\/]/).pop()} (${doc.processing_status})`;
      select.appendChild(opt);
    });
  }

  async function logout() {
    await fetch(`${API}/logout`, { method: 'POST', credentials: 'include' }).catch(() => {});
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('chat-screen').style.display = 'none';
    document.getElementById('email').value = '';
    document.getElementById('password').value = '';
    document.getElementById('messages').innerHTML = `
      <div class="empty-state" id="empty-state">
        <div class="empty-icon">◈</div>
        <div class="empty-title">Select a document to begin</div>
        <div class="empty-sub">// ask anything about your doc</div>
      </div>`;
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  }

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 120) + 'px';
  }

  function appendMessage(role, text) {
    document.getElementById('empty-state')?.remove();
    const container = document.getElementById('messages');
    const wrap = document.createElement('div');
    wrap.className = `msg-wrap ${role}`;
    wrap.innerHTML = `
      <div class="msg-label">${role === 'user' ? 'YOU' : 'DOCCHAT'}</div>
      <div class="bubble">${text.replace(/\n/g, '<br>')}</div>`;
    container.appendChild(wrap);
    container.scrollTop = container.scrollHeight;
  }

  function showTyping() {
    document.getElementById('empty-state')?.remove();
    const container = document.getElementById('messages');
    const wrap = document.createElement('div');
    wrap.className = 'msg-wrap bot';
    wrap.id = 'typing';
    wrap.innerHTML = `<div class="msg-label">DOCCHAT</div>
      <div class="typing-indicator"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>`;
    container.appendChild(wrap);
    container.scrollTop = container.scrollHeight;
  }

  async function sendMessage() {
    const docId = document.getElementById('doc-select').value;
    const input = document.getElementById('chat-input');
    const query = input.value.trim();

    if (!docId) return showError('Select a document first');
    if (!query || isLoading) return;

    isLoading = true;
    document.getElementById('send-btn').disabled = true;
    input.value = '';
    input.style.height = 'auto';

    appendMessage('user', query);
    showTyping();

    try {
      const res = await fetch(`${API}/chat`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',  // sends cookies
        body: JSON.stringify({ document_id: parseInt(docId), query })
      });

      document.getElementById('typing')?.remove();

      if (res.status === 401) {
        appendMessage('bot', '⚠ Session expired. Please login again.');
        setTimeout(logout, 2000);
      } else if (!res.ok) {
        const err = await res.json();
        appendMessage('bot', `⚠ ${err.detail || 'Something went wrong'}`);
      } else {
        const data = await res.json();
        appendMessage('bot', data.answer);
      }

    } catch (e) {
      document.getElementById('typing')?.remove();
      appendMessage('bot', '⚠ Cannot reach server.');
    }

    isLoading = false;
    document.getElementById('send-btn').disabled = false;
    input.focus();
  }
</script>
</body>
</html>
